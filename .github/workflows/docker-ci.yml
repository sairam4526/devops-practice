name: SaiBank CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sairam4526/saibank-app:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Docker image
        run: docker push sairam4526/saibank-app:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_SECRET
          script: |
            docker pull sairam4526/saibank-app:${{ github.sha }}
            docker stop saibank-prod || true
            docker rm saibank-prod || true
            docker run -d --name saibank-prod -p 5000:5000 -e APP_SECRET="$APP_SECRET" sairam4526/saibank-app:${{ github.sha }}